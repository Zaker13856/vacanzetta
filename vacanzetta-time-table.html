<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏖️ Vacanzetta Time Table</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0e1117; color: #e6e6e6;
    min-height: 100vh; padding: 24px 16px;
    display: flex; flex-direction: column; align-items: center;
  }
  .head { text-align: center; margin-bottom: 18px; }
  .title { font-size: 26px; font-weight: 700; }
  .sub { font-size: 14px; color: #6b7482; margin-top: 4px; }
  .table {
    width: 100%; max-width: 600px;
    display: grid; grid-template-columns: 1fr auto auto; gap: 10px 18px;
    align-items: center;
  }
  .colhead { font-size: 11px; letter-spacing: 1px; color: #4d5563; text-align: center; }
  .person { display: flex; align-items: center; gap: 12px;
    background: #171b22; border: 1px solid #262c36; border-radius: 14px; padding: 10px 14px; }
  .ava { width: 40px; height: 40px; border-radius: 50%; flex: 0 0 auto;
    background: #22303f; color: #7fb4ff; display: flex; align-items: center;
    justify-content: center; font-weight: 700; font-size: 17px; }
  .name { font-weight: 600; font-size: 16px; }
  .place { font-size: 12px; color: #6b7482; margin-top: 1px; }
  .clock { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; text-align: center; }
  .clock.away { color: #7fb4ff; }
  .foot { font-size: 12px; color: #4d5563; margin-top: 20px; text-align: center; max-width: 600px; }
</style>
</head>
<body>
  <div class="head">
    <div class="title">🏖️ Vacanzetta Time Table</div>
    <div class="sub">Solo Rezza è partito davvero 😎</div>
  </div>

  <div class="table">
    <div></div>
    <div class="colhead">CAMPER</div>
    <div class="colhead">DESTINAZIONE</div>
    <div id="rows" style="display:contents;"></div>
  </div>

  <div class="foot">
    Formello, Ladispoli e Passoscuro sono in Italia → stesso fuso di Roma, quindi le due colonne coincidono.
    Quando qualcuno parte per l'estero, cambia il suo <code>tz</code> qui sotto nel codice e l'ora si aggiorna da sola.
  </div>

<script>
// ── Modifica qui quando qualcuno parte ──────────────────────────────
// Colonna 1 = sempre Roma (per tutti). Colonna 2 = tz della destinazione.
// tz IANA: 'Asia/Tokyo', 'America/New_York', 'Europe/London', 'Asia/Dubai'...
// Tutte le città italiane = 'Europe/Rome'.
// Per orari "sfalsati" (non un vero fuso), usa offsetHours invece di tz.
var people = [
  {name:'Rezza',  dest:'❓',         unknown:true},
  {name:'Edo',    dest:'❓',         tz:'Europe/Rome'},
  {name:'Orso',   dest:'Formello',   tz:'Europe/Rome'},
  {name:'Chino',  dest:'Ladispoli',  tz:'Europe/Rome'},
  {name:'Puccio', dest:'Roma +1h',   offsetHours:1},
  {name:'Santo',  dest:'Passoscuro', tz:'Europe/Rome'},
  {name:'Lanzi',  dest:'Roma',       tz:'Europe/Rome'}
];
// ────────────────────────────────────────────────────────────────────

var rows = document.getElementById('rows');
people.forEach(function(p, i){
  var away = (p.tz !== 'Europe/Rome');
  rows.insertAdjacentHTML('beforeend',
    '<div class="person">' +
      '<div class="ava">' + p.name[0] + '</div>' +
      '<div><div class="name">' + p.name + '</div><div class="place">' + p.dest + '</div></div>' +
    '</div>' +
    '<div class="clock" id="r' + i + '">--:--:--</div>' +
    '<div class="clock' + (away ? ' away' : '') + '" id="d' + i + '">--:--:--</div>'
  );
});

function pad(n){ return String(n).padStart(2,'0'); }

function tick(){
  var now = new Date();
  var opt = {hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false};
  var romaStr = new Intl.DateTimeFormat('it-IT', Object.assign({timeZone:'Europe/Rome'}, opt)).format(now);
  people.forEach(function(p, i){
    document.getElementById('r' + i).textContent = romaStr;
    if (p.unknown) {
      document.getElementById('d' + i).textContent = '--:--:--';
    } else if (p.name === 'Edo') {
      document.getElementById('d' + i).textContent = '❓';
    } else if (p.offsetHours !== undefined) {
      // Sfalsato rispetto a Roma (non un vero fuso): prendo l'ora di Roma e sommo l'offset
      var parts = romaStr.split(':').map(Number);
      var h = (parts[0] + p.offsetHours + 24) % 24;
      document.getElementById('d' + i).textContent = pad(h) + ':' + pad(parts[1]) + ':' + pad(parts[2]);
    } else {
      document.getElementById('d' + i).textContent =
        new Intl.DateTimeFormat('it-IT', Object.assign({timeZone:p.tz}, opt)).format(now);
    }
  });
}
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
